name: Triage issues

# 새 이슈를 Jev로 분류해 미리 정한 라벨을 붙인다. 독자가 쓴 글이 입력이므로 main의 고정 스크립트만 실행한다.
# 이슈 제목과 본문은 스크립트가 이벤트 파일에서 읽는다. 여기에 식으로 끼워 넣지 않는다.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: 다시 분류할 이슈 번호
        required: true
        type: number

permissions: {}

# 이슈 이벤트로 도는 작업은 기본 브랜치의 캐시를 읽을 수 있다. 이 워크플로는 캐시를 쓰지 않으므로 읽기도 막는다.
cache-mode: none

concurrency:
  group: issue-triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Jev 키는 이 환경에만 있고 환경의 허용 브랜치는 main이다. PR에서 고친 워크플로는 이 키를 읽지 못한다.
    environment: issue-triage
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts

      # 스크립트는 npm 패키지를 쓰지 않는다. 설치를 하지 않으므로 키가 있는 작업에서 외부 패키지 코드가 실행되지 않는다.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Classify the issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: node scripts/issue-triage.ts

      # 처음 붙인 라벨이 맞았는지 나중에 평가하려면 그때의 판정값이 필요하다. 이슈 본문은 들어 있지 않다.
      # 같은 실행을 다시 돌려도 run_id는 같다. 시도 번호를 넣어 처음의 기록과 이름이 겹치지 않게 한다.
      - name: Keep the verdict record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-record-${{ github.event.issue.number || inputs.issue }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/triage-record.json
          retention-days: 90
          if-no-files-found: ignore
