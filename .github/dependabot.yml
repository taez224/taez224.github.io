version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
    # astro check는 TypeScript 7을 지원하지 않고, Astro 7.3.4부터는 7을 감지하면 검사를 거부한다.
    # TS 7.1과 @astrojs/ts-content-mapper로 옮기기 전까지 major 갱신은 받지 않는다.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
