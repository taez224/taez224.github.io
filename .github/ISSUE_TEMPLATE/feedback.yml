name: 오류·의견 보내기
description: 사이트의 오류, 글의 잘못된 내용, 개선 의견을 알려 주세요.
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 보내시기 전에 두 가지를 알려 드립니다.

        - 제보는 누구나 볼 수 있는 공개 이슈로 등록됩니다. 개인 정보는 적지 말아 주세요.
        - 제보 내용은 종류를 자동으로 분류하기 위해 TypeSafe의 분류 모델에 전달됩니다.
  - type: input
    id: page
    attributes:
      label: 페이지
      description: 제보하려는 페이지의 주소입니다. 사이트의 제보 링크로 오셨다면 이미 채워져 있습니다.
      placeholder: https://taez224.github.io/
  - type: textarea
    id: what
    attributes:
      label: 무엇을 발견하셨나요
      description: 잘못된 문장이나 이상하게 보이는 부분을 그대로 적어 주시면 찾기 쉽습니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 어떻게 되면 좋을까요
      description: 떠오르는 것이 있을 때만 적어 주세요.
